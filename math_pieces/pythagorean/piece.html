<title>The Pythagorean Theorem</title>
<style>
  :root { --board: #24303d; --board-2: #1c2833; --chalk: #ede9df; --chalk-dim: rgba(237,233,223,0.55); --gold: #d9a441; --coral: #e2725b; --blue: #7fa6c9; }
  * { box-sizing: border-box; } html, body { margin: 0; padding: 0; }
  #stage { position: relative; width: 100%; height: 100vh; min-height: 560px; overflow: hidden;
    background: radial-gradient(120% 140% at 50% 0%, var(--board) 0%, var(--board-2) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--chalk); }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .frame { position: absolute; inset: 14px; border: 1px solid rgba(237,233,223,0.14); border-radius: 2px; pointer-events: none; }
  .kicker { position: absolute; top: 1.4rem; left: 50%; transform: translateX(-50%); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--chalk-dim); }
  .replay { position: absolute; right: 1.1rem; top: 1.2rem; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--chalk); background: transparent; border: 1px solid rgba(237,233,223,0.4); border-radius: 3px; padding: 0.35rem 0.7rem; cursor: pointer; opacity: 0.7; }
  .replay:hover { opacity: 1; }
</style>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="frame"></div>
  <div class="kicker" id="kicker">right triangles</div>
  <button class="replay" id="replayBtn" type="button">Replay</button>
</div>
<script src="../../pipeline/canvas_lib/helpers.js"></script>
<script>
(function () {
  const CP = window.CanvasPiece;
  const canvas = document.getElementById('c');
  const stage = document.getElementById('stage');
  const kickerEl = document.getElementById('kicker');
  const replayBtn = document.getElementById('replayBtn');
  const { ctx } = CP.setupCanvas(canvas, stage);
  const getW = () => stage.clientWidth, getH = () => stage.clientHeight;
  const MONO = 'ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace';
  const SERIF = 'Iowan Old Style, "Palatino Linotype", Palatino, Georgia, serif';

  // { kicker, hook, a, b, c }  -- a right triangle with legs a,b, hypotenuse c (a²+b²=c²)
  // Narration (4 lines): 0=hook, 1=intro the triangle, 2=show the squares on each side, 3=reveal.
  const P = window.__PARAMS__ && window.__PARAMS__.a ? window.__PARAMS__ : {
    kicker: 'right triangles', hook: 'Any right triangle: a² + b² = c²',
    a: 3, b: 4, c: 5, footnote: 'true for every right triangle, any size',
  };
  kickerEl.textContent = P.kicker || 'right triangles';

  const LT = window.__LINE_TIMES__ || [
    { start: 0, end: 4 }, { start: 4, end: 9 }, { start: 9, end: 16 }, { start: 16, end: 22 },
  ];
  const T = { introStart: LT[1].start, introEnd: LT[1].end, sqStart: LT[2].start, sqEnd: LT[2].end, finalStart: LT[3].start, total: LT[3].end };

  function draw(t) {
    const W = getW(), H = getH();
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.strokeStyle = 'rgba(58,75,92,0.35)'; ctx.lineWidth = 1;
    const grid = 34;
    for (let x = (W % grid) / 2; x < W; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = (H % grid) / 2; y < H; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();

    const hookAlpha = t < T.introStart ? 1 : CP.clamp01(1 - (t - T.introStart) / 0.8);
    if (hookAlpha > 0.01) {
      ctx.save(); ctx.globalAlpha = hookAlpha; ctx.fillStyle = '#ede9df'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 ${Math.min(W * 0.06, 38)}px ${MONO}`;
      ctx.fillText(P.hook, W / 2, H * 0.14);
      ctx.restore();
    }

    // unit was 0.052 -- the whole triangle+squares composite stayed a
    // small cluster; the squares on each leg extend further down/right
    // than up/left from (cx,cy), so on the actual 1080x1920 canvas the
    // figure sat low in the frame with dead space above it. Bigger unit
    // and a higher cy fill the frame and recenter the composite shape.
    const unit = Math.min(W, H) * 0.075;
    const cx = W / 2, cy = H * 0.42;
    // right triangle with the right angle at bottom-left of this local frame
    const ax = -P.b * unit / 2, ay = P.a * unit / 2;   // top vertex offset
    const p0 = { x: cx - P.b * unit / 2, y: cy + P.a * unit / 2 }; // bottom-left (right angle)
    const p1 = { x: cx + P.b * unit / 2, y: cy + P.a * unit / 2 }; // bottom-right
    const p2 = { x: cx - P.b * unit / 2, y: cy - P.a * unit / 2 }; // top-left

    const introP = CP.clamp01((t - T.introStart) / (T.introEnd - T.introStart));
    if (t >= T.introStart) {
      ctx.save();
      ctx.globalAlpha = CP.easeOutCubic(Math.min(1, introP * 1.4));
      ctx.strokeStyle = '#7fa6c9'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(p2.x, p2.y); ctx.lineTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#ede9df'; ctx.font = `500 ${Math.min(unit * 0.55, 24)}px ${MONO}`; ctx.textAlign = 'center';
      ctx.fillText(String(P.a), p0.x - 24, (p0.y + p2.y) / 2);
      ctx.fillText(String(P.b), (p0.x + p1.x) / 2, p0.y + 26);
      ctx.fillStyle = '#d9a441';
      ctx.fillText(String(P.c), (p2.x + p1.x) / 2 + 18, (p2.y + p1.y) / 2 - 10);
      ctx.restore();
    }

    const sqP = CP.clamp01((t - T.sqStart) / (T.sqEnd - T.sqStart));
    if (t >= T.sqStart) {
      const reveal = CP.easeOutCubic(Math.min(1, sqP * 1.3));
      ctx.save();
      ctx.globalAlpha = reveal * 0.55;
      // square on leg a (left side)
      ctx.fillStyle = '#7fa6c9';
      ctx.fillRect(p2.x - P.a * unit, p2.y, P.a * unit, P.a * unit);
      // square on leg b (bottom)
      ctx.fillRect2 = null;
      ctx.fillRect(p0.x, p0.y, P.b * unit, P.b * unit);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = reveal * 0.55;
      ctx.fillStyle = '#d9a441';
      // square on hypotenuse (approx, offset perpendicular)
      const hx = p1.x - p2.x, hy = p1.y - p2.y;
      const nx = -hy, ny = hx; const nlen = Math.hypot(nx, ny); const ux = nx / nlen, uy = ny / nlen;
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y); ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p1.x + ux * P.c * unit, p1.y + uy * P.c * unit);
      ctx.lineTo(p2.x + ux * P.c * unit, p2.y + uy * P.c * unit);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      if (sqP > 0.5) {
        ctx.save();
        ctx.globalAlpha = CP.clamp01((sqP - 0.5) / 0.5);
        ctx.fillStyle = '#ede9df'; ctx.textAlign = 'center';
        ctx.font = `600 ${Math.min(W * 0.032, 20)}px ${MONO}`;
        ctx.fillText(`${P.a}² = ${P.a * P.a}`, p2.x - P.a * unit / 2, p2.y + P.a * unit / 2);
        ctx.fillText(`${P.b}² = ${P.b * P.b}`, p0.x + P.b * unit / 2, p0.y + P.b * unit / 2);
        ctx.fillStyle = '#d9a441';
        ctx.fillText(`${P.c}² = ${P.c * P.c}`, p2.x + ux * P.c * unit / 2 + (p1.x - p2.x) / 2, p2.y + uy * P.c * unit / 2 + (p1.y - p2.y) / 2);
        ctx.restore();
      }
    }

    const finP = CP.clamp01((t - T.finalStart) / (T.total - T.finalStart));
    if (t >= T.finalStart) {
      const fEase = CP.easeOutCubic(finP);
      const y = H * 0.90;
      ctx.save();
      ctx.globalAlpha = fEase; ctx.textAlign = 'center'; ctx.fillStyle = '#ede9df';
      ctx.font = `500 ${Math.min(W * 0.03, 20)}px ${MONO}`;
      ctx.fillText(`${P.a}² + ${P.b}² =`, W / 2 - 60, y);
      const pop = finP > 0.5 ? CP.easeOutBack(CP.clamp01((finP - 0.5) / 0.5)) : 0;
      ctx.save(); ctx.translate(W / 2 + 90, y); ctx.scale(0.7 + 0.3 * pop, 0.7 + 0.3 * pop);
      ctx.globalAlpha = CP.clamp01(pop); ctx.fillStyle = '#d9a441';
      ctx.font = `700 ${Math.min(W * 0.06, 34)}px ${MONO}`;
      ctx.fillText(`${P.c}²`, 0, 0);
      ctx.restore();
      ctx.restore();
      if (P.footnote && finP > 0.75) {
        ctx.save(); ctx.globalAlpha = CP.clamp01((finP - 0.75) / 0.25) * 0.8; ctx.fillStyle = '#e2725b';
        ctx.font = `italic 400 ${Math.min(W * 0.02, 14)}px ${SERIF}`; ctx.textAlign = 'center';
        ctx.fillText(P.footnote, W / 2, y + 30);
        ctx.restore();
      }
    }
  }
  const timeline = CP.createTimeline({ draw, total: T.total });
  replayBtn.addEventListener('click', () => { timeline.reset(); });
})();
</script>
