<title>Grid Area</title>
<style>
  :root {
    --board: #24303d;
    --board-2: #1c2833;
    --chalk: #ede9df;
    --chalk-dim: rgba(237,233,223,0.55);
    --gold: #d9a441;
    --coral: #e2725b;
    --blue: #7fa6c9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 560px;
    overflow: hidden;
    background: radial-gradient(120% 140% at 50% 0%, var(--board) 0%, var(--board-2) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--chalk);
  }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .frame { position: absolute; inset: 14px; border: 1px solid rgba(237,233,223,0.14); border-radius: 2px; pointer-events: none; }
  .kicker {
    position: absolute; top: 1.4rem; left: 50%; transform: translateX(-50%);
    font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--chalk-dim);
  }
  .replay {
    position: absolute; right: 1.1rem; top: 1.2rem; font-size: 0.68rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--chalk); background: transparent;
    border: 1px solid rgba(237,233,223,0.4); border-radius: 3px; padding: 0.35rem 0.7rem;
    cursor: pointer; opacity: 0.7;
  }
  .replay:hover { opacity: 1; }
  .replay:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="frame"></div>
  <div class="kicker" id="kicker">shapes on a grid</div>
  <button class="replay" id="replayBtn" type="button">Replay</button>
</div>

<script src="../../pipeline/canvas_lib/helpers.js"></script>
<script>
(function () {
  const CP = window.CanvasPiece;
  const canvas = document.getElementById('c');
  const stage = document.getElementById('stage');
  const kickerEl = document.getElementById('kicker');
  const replayBtn = document.getElementById('replayBtn');

  const { ctx } = CP.setupCanvas(canvas, stage);
  const getW = () => stage.clientWidth, getH = () => stage.clientHeight;

  const MONO = 'ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace';
  const SERIF = 'Iowan Old Style, "Palatino Linotype", Palatino, Georgia, serif';

  // ---- generic contract ----
  // { kicker, hook, rows, cols, mode: "area"|"perimeter"|"triangle",
  //   revealLabel, revealValue, footnote }
  // Narration-line contract (fixed 4 lines): 0=hook, 1=intro the grid,
  // 2=count (squares / perimeter units / triangle half), 3=final reveal.
  const P = window.__PARAMS__ && window.__PARAMS__.rows ? window.__PARAMS__ : {
    kicker: 'area of a rectangle', hook: 'Area of a 6 × 4 rectangle?',
    rows: 4, cols: 6, mode: 'area',
    revealLabel: 'rows × columns =', revealValue: '24',
    footnote: 'count the rows, count the columns, multiply',
  };
  kickerEl.textContent = P.kicker || 'shapes on a grid';

  const LT = window.__LINE_TIMES__ || [
    { start: 0, end: 4 }, { start: 4, end: 9 }, { start: 9, end: 16 }, { start: 16, end: 22 },
  ];
  const T = {
    introStart: LT[1].start, introEnd: LT[1].end,
    countStart: LT[2].start, countEnd: LT[2].end,
    finalStart: LT[3].start,
    total: LT[3].end,
  };

  function gridGeom() {
    const W = getW(), H = getH();
    const maxW = W * 0.72, maxH = H * 0.32;
    const cell = Math.min(maxW / P.cols, maxH / P.rows, 70);
    const gw = cell * P.cols, gh = cell * P.rows;
    return { left: (W - gw) / 2, top: H * 0.32, cell, gw, gh };
  }

  function draw(t) {
    const W = getW(), H = getH();
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.strokeStyle = 'rgba(58,75,92,0.35)';
    ctx.lineWidth = 1;
    const grid = 34;
    for (let x = (W % grid) / 2; x < W; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = (H % grid) / 2; y < H; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();

    const hookAlpha = t < T.introStart ? 1 : CP.clamp01(1 - (t - T.introStart) / 0.8);
    if (hookAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = hookAlpha;
      ctx.fillStyle = '#ede9df';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `600 ${Math.min(W * 0.058, 38)}px ${MONO}`;
      ctx.fillText(P.hook, W / 2, H * 0.16);
      ctx.restore();
    }

    const g = gridGeom();
    const introP = CP.clamp01((t - T.introStart) / (T.introEnd - T.introStart));
    const countP = CP.clamp01((t - T.countStart) / (T.countEnd - T.countStart));

    if (t >= T.introStart) {
      ctx.save();
      ctx.globalAlpha = CP.easeOutCubic(Math.min(1, introP * 1.4));
      ctx.strokeStyle = 'rgba(237,233,223,0.5)';
      ctx.lineWidth = 2;
      for (let r = 0; r <= P.rows; r++) {
        ctx.beginPath();
        ctx.moveTo(g.left, g.top + r * g.cell);
        ctx.lineTo(g.left + g.gw, g.top + r * g.cell);
        ctx.stroke();
      }
      for (let c = 0; c <= P.cols; c++) {
        ctx.beginPath();
        ctx.moveTo(g.left + c * g.cell, g.top);
        ctx.lineTo(g.left + c * g.cell, g.top + g.gh);
        ctx.stroke();
      }
      ctx.restore();
    }

    let countValue = 0;

    if (t >= T.countStart && P.mode === 'area') {
      const totalCells = P.rows * P.cols;
      const shown = Math.floor(countP * totalCells * 1.05);
      countValue = Math.min(totalCells, shown);
      for (let i = 0; i < shown && i < totalCells; i++) {
        const r = Math.floor(i / P.cols), c = i % P.cols;
        ctx.save();
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = '#d9a441';
        ctx.fillRect(g.left + c * g.cell + 2, g.top + r * g.cell + 2, g.cell - 4, g.cell - 4);
        ctx.restore();
      }
    } else if (t >= T.countStart && P.mode === 'triangle') {
      const shown = countP;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(g.left, g.top);
      ctx.lineTo(g.left + g.gw, g.top + g.gh);
      ctx.lineTo(g.left, g.top + g.gh);
      ctx.closePath();
      ctx.clip();
      ctx.globalAlpha = 0.75 * CP.easeOutCubic(shown);
      ctx.fillStyle = '#d9a441';
      ctx.fillRect(g.left, g.top, g.gw, g.gh);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = CP.easeOutCubic(shown);
      ctx.strokeStyle = '#e2725b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(g.left, g.top);
      ctx.lineTo(g.left + g.gw, g.top + g.gh);
      ctx.stroke();
      ctx.restore();
      countValue = (P.rows * P.cols) / 2;
    } else if (t >= T.countStart && P.mode === 'perimeter') {
      const perim = 2 * (P.rows + P.cols);
      const pathLenPx = 2 * (g.gw + g.gh);
      const drawn = CP.clamp01(countP * 1.05) * pathLenPx;
      ctx.save();
      ctx.strokeStyle = '#d9a441';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      let remaining = drawn;
      const segs = [
        [g.left, g.top, g.left + g.gw, g.top],
        [g.left + g.gw, g.top, g.left + g.gw, g.top + g.gh],
        [g.left + g.gw, g.top + g.gh, g.left, g.top + g.gh],
        [g.left, g.top + g.gh, g.left, g.top],
      ];
      for (const [x1, y1, x2, y2] of segs) {
        const segLen = Math.hypot(x2 - x1, y2 - y1);
        if (remaining <= 0) break;
        const t2 = Math.min(1, remaining / segLen);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 + (x2 - x1) * t2, y1 + (y2 - y1) * t2);
        ctx.stroke();
        remaining -= segLen;
      }
      ctx.restore();
      countValue = Math.round(perim * CP.clamp01(countP * 1.05));
    }

    const finP = CP.clamp01((t - T.finalStart) / (T.total - T.finalStart));
    if (t >= T.finalStart) {
      const fEase = CP.easeOutCubic(finP);
      const y = H * 0.72;
      ctx.save();
      ctx.globalAlpha = fEase;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ede9df';
      ctx.font = `500 ${Math.min(W * 0.032, 22)}px ${MONO}`;
      ctx.fillText(P.revealLabel || '', W / 2, y);
      const pop = finP > 0.5 ? CP.easeOutBack(CP.clamp01((finP - 0.5) / 0.5)) : 0;
      ctx.save();
      ctx.translate(W / 2, y + 80);
      ctx.scale(0.7 + 0.3 * pop, 0.7 + 0.3 * pop);
      ctx.globalAlpha = CP.clamp01(pop);
      ctx.fillStyle = '#d9a441';
      ctx.font = `700 ${Math.min(W * 0.11, 60)}px ${MONO}`;
      ctx.fillText(P.revealValue, 0, 0);
      ctx.restore();
      ctx.restore();

      if (P.footnote && finP > 0.75) {
        ctx.save();
        ctx.globalAlpha = CP.clamp01((finP - 0.75) / 0.25) * 0.8;
        ctx.fillStyle = '#e2725b';
        ctx.font = `italic 400 ${Math.min(W * 0.02, 14)}px ${SERIF}`;
        ctx.textAlign = 'center';
        ctx.fillText(P.footnote, W / 2, y + 118);
        ctx.restore();
      }
    }
  }

  const timeline = CP.createTimeline({ draw, total: T.total });
  replayBtn.addEventListener('click', () => { timeline.reset(); });
})();
</script>
