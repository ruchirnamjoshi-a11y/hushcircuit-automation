name: Weekly Analytics

on:
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth tokens (one per channel/track)
        # A track's secret being unset is fine — run_weekly_analytics.py
        # skips that track cleanly (channel not set up yet).
        run: |
          mkdir -p secrets
          write_token() {
            if [ -n "$2" ]; then
              echo "$2" | base64 -d > "secrets/youtube_token_$1.json"
            fi
          }
          write_token kids "${{ secrets.YOUTUBE_TOKEN_B64_KIDS }}"
          write_token teens "${{ secrets.YOUTUBE_TOKEN_B64_TEENS }}"
          write_token adults "${{ secrets.YOUTUBE_TOKEN_B64_ADULTS }}"
          write_token women "${{ secrets.YOUTUBE_TOKEN_B64_WOMEN }}"
          write_token hindi_mythology "${{ secrets.YOUTUBE_TOKEN_B64_HINDI_MYTHOLOGY }}"
          write_token hero_saga "${{ secrets.YOUTUBE_TOKEN_B64_HERO_SAGA }}"

      - name: Pull weekly analytics
        run: python run_weekly_analytics.py

      - name: Refill story queue (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_weekly_story_refill.py

      - name: Commit report and refilled queue
        # Runs even if story refill failed a track (or all of them) --
        # otherwise a single Gemini hiccup on one track discards the
        # analytics report from the PRIOR step too, since it's the same
        # job and this step wasn't gated to run regardless. Confirmed live:
        # both the 2026-08-17 and 2026-08-24 runs wrote real analytics
        # reports (kids, hindi_mythology) that were silently lost because
        # story refill exited non-zero and this step never ran. Same fix
        # daily-video.yml already has on its equivalent commit step.
        if: always()
        run: |
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add analytics/ scripts_queue/
          git diff --cached --quiet || git commit -m "chore: weekly analytics report + story refill [skip ci]"
          git push

