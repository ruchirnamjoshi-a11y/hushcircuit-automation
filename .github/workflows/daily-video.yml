name: Daily Video

on:
  schedule:
    # Every 4 hours, not once a day: if Cloudflare's free image quota is
    # exhausted, run_daily.py aborts the whole run rather than publishing a
    # video with no matching artwork (see run_daily.py's docstring) —
    # running repeatedly lets that abort get retried later the same day
    # once quota resets. pipeline/state.py stops a track that already
    # succeeded earlier in the day from being produced again.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'YouTube privacy status for this manual run'
        required: false
        default: 'private'
        type: choice
        options: [private, unlisted, public]

concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    # run_daily.py produces one video per story track (kids/teens/adults/
    # women) in a single run, so this needs headroom for ~4x the work of a
    # single video.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure ffmpeg is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth token
        run: |
          mkdir -p secrets
          echo "${{ secrets.YOUTUBE_TOKEN_B64 }}" | base64 -d > secrets/youtube_token.json

      - name: Run daily pipeline (all story tracks)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_FILE: secrets/youtube_token.json
        # Scheduled runs publish for real (public); manual runs default to
        # private so you can sanity-check a run without publishing it live.
        # run_daily.py loops over every track (kids/teens/adults/women),
        # skipping any with an empty queue or already produced today, and
        # aborting the whole run (not a failure — exit code stays 0) if
        # Cloudflare's image quota is exhausted, retried by the next
        # scheduled run. It exits non-zero only on a real per-track
        # failure, which fails this job so that's visible.
        run: |
          PRIVACY="${{ github.event_name == 'workflow_dispatch' && inputs.privacy || 'public' }}"
          python run_daily.py --privacy "$PRIVACY"

      - name: Commit consumed scripts and daily-production state
        # Runs even if the pipeline step failed a track, so any tracks that
        # DID succeed still get their consumed script + state committed.
        if: always()
        run: |
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts_queue/
          git diff --cached --quiet || git commit -m "chore: consume queued scripts / update daily state [skip ci]"
          git push

