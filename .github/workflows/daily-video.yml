name: Daily Video

on:
  schedule:
    # Every 4 hours, not once a day: if Cloudflare's free image quota is
    # exhausted, run_daily.py aborts the whole run rather than publishing a
    # video with no matching artwork (see run_daily.py's docstring) —
    # running repeatedly lets that abort get retried later the same day
    # once quota resets. pipeline/state.py stops a track that already
    # succeeded earlier in the day from being produced again.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'YouTube privacy status for this manual run'
        required: false
        default: 'private'
        type: choice
        options: [private, unlisted, public]

concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    # run_daily.py produces one Short per story track, and TWO videos
    # (Short + long-form) for tracks with Track.produce_long_form=True —
    # currently kids (English) and hindi_mythology (the Hindi-language
    # variant of the kids track, reusing kids' generated images at no
    # extra image-generation cost — see run_daily.py's docstring). This
    # needs headroom for that extra long-form assembly + upload work.
    # 150 minutes: 240 let a genuine hang (a slow apt mirror stalling the
    # ffmpeg install step, since fixed below) silently burn 4 hours before
    # failing. But 90 turned out too tight for real production once
    # measured on GitHub's actual runners -- a full run (all tracks,
    # Short + long-form) didn't finish a single track in 90 minutes even
    # after the apt fix, so 90 was cutting into legitimate work, not just
    # hangs. 150 gives real multi-track runs comfortable headroom while
    # still failing far faster than 240 if something genuinely hangs again.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure ffmpeg is installed
        run: |
          # Static binary download, not apt: this runner image turned out
          # not to have ffmpeg preinstalled after all, and apt-get update
          # itself (not even the install) hung indefinitely against a
          # broken azure.archive.ubuntu.com mirror -- observed twice today,
          # burning a full job timeout each time before ever reaching the
          # actual pipeline. A static build from johnvansickle.com sidesteps
          # Ubuntu's package mirrors entirely; --max-time bounds it so a
          # bad download fails in under 2 minutes instead of hanging for
          # hours again.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
          else
            curl -sSL --max-time 120 --retry 2 \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              -o /tmp/ffmpeg.tar.xz
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            sudo mv /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
            ffmpeg -version | head -1
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (math_explainers track only)
        # No AI video model involved — pipeline.canvas_video renders
        # hand-authored canvas animations with a real headless browser.
        # --with-deps pulls the system libs Chromium needs on a bare runner.
        run: playwright install --with-deps chromium

      - name: Restore YouTube OAuth tokens (one per channel/track)
        # A track's secret being unset is fine — run_daily.py skips that
        # track cleanly (channel not set up yet) rather than failing.
        run: |
          mkdir -p secrets
          write_token() {
            if [ -n "$2" ]; then
              echo "$2" | base64 -d > "secrets/youtube_token_$1.json"
              echo "Restored token for $1"
            else
              echo "No YOUTUBE_TOKEN_B64_$(echo "$1" | tr a-z A-Z) secret set — $1 will be skipped"
            fi
          }
          write_token kids "${{ secrets.YOUTUBE_TOKEN_B64_KIDS }}"
          write_token teens "${{ secrets.YOUTUBE_TOKEN_B64_TEENS }}"
          write_token adults "${{ secrets.YOUTUBE_TOKEN_B64_ADULTS }}"
          write_token women "${{ secrets.YOUTUBE_TOKEN_B64_WOMEN }}"
          # Secret name kept as HINDI_MYTHOLOGY (retiring the old mythology
          # content, not the channel/token) — this channel now posts the
          # Hindi-language version of the "kids" track's stories.
          write_token hindi_mythology "${{ secrets.YOUTUBE_TOKEN_B64_HINDI_MYTHOLOGY }}"
          write_token hero_saga "${{ secrets.YOUTUBE_TOKEN_B64_HERO_SAGA }}"
          write_token math_explainers "${{ secrets.YOUTUBE_TOKEN_B64_MATH_EXPLAINERS }}"

      - name: Run daily pipeline (all story tracks)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Not used by any track's TTS today (hindi_mythology uses
          # edge-tts, same as every other track) — kept here in case a
          # track's tts_provider gets switched to "gemini" again later.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Scheduled runs publish for real (public); manual runs default to
        # private so you can sanity-check a run without publishing it live.
        # run_daily.py loops over every track (kids/teens/adults/women),
        # skipping any with an empty queue, no OAuth token yet, or already
        # produced today, and aborting the whole run (not a failure — exit
        # code stays 0) if Cloudflare's image quota is exhausted, retried
        # by the next scheduled run. It exits non-zero only on a real
        # per-track failure, which fails this job so that's visible.
        run: |
          PRIVACY="${{ github.event_name == 'workflow_dispatch' && inputs.privacy || 'public' }}"
          # -u: unbuffered stdout. Without it, Python block-buffers output
          # when it's not a real terminal (true of every GH Actions log
          # capture pipe), so run_daily.py's per-track/per-scene progress
          # prints never reach the log until the buffer fills or the
          # process exits -- a run that's actually working looks identical
          # to a hung one in the CI log for the entire buffered stretch.
          python -u run_daily.py --privacy "$PRIVACY"

      - name: Commit consumed scripts and daily-production state
        # Runs even if the pipeline step failed a track, so any tracks that
        # DID succeed still get their consumed script + state committed.
        if: always()
        run: |
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts_queue/
          git diff --cached --quiet || git commit -m "chore: consume queued scripts / update daily state [skip ci]"
          # --rebase: this step's checkout can be hours old by the time a
          # long production run finishes, so master has often moved on by
          # push time (observed: a real push rejected as non-fast-forward
          # because commits landed on master mid-run) -- rebase the local
          # state-tracking commit on top instead of failing outright.
          git pull --rebase origin master
          git push

